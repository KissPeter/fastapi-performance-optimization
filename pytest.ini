[pytest]
markers =
    middlewares: -
    sync_async: -
    json_classes: -
    nginx_port_vs_socket: -
    gunicorn_vs_uvicorn: -
    nginx_socker_keepalive: -
    workers_and_threads: -
    server_runners: -
    connection_pool: -
    concurrency: -
    thread_pool_tuning: FastAPI performance: anyio thread pool token tuning
    pool_exhaustion: FastAPI performance: pool exhaustion and timeout behavior
    robustness: Robustness: retry patterns, circuit breaker (generic, not FastAPI-specific)
