services:


  app:
    image: fastapi-performance-optimization:latest
    container_name: fastapi-performance-optimization
    build:
      context: app_files
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: '2'
    restart: always
  app_default_json_response_class:
    image: fastapi-performance-optimization:latest
    ports:
    - 8005:8000
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      JSONRESPONSECLASS: JSONResponse

  app_nginx_port:
    image: fastapi-performance-optimization:latest
    ports:
    - "8008:8080"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      THREADS: 1
      WORKERS: 3
  app_nginx_socket:
    image: fastapi-performance-optimization:latest
    ports:
    - "8009:8081"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      SOCKET: 1
      THREADS: 1
      WORKERS: 3
  app_nginx_socket_keepalive:
    image: fastapi-performance-optimization:latest
    ports:
    - "8017:8082"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      KEEPALIVE: 1
      SOCKET: 1
      THREADS: 1
      WORKERS: 3
  app_no_middleware:
    image: fastapi-performance-optimization:latest
    ports:
    - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
  app_ojson_response_class:
    image: fastapi-performance-optimization:latest
    ports:
    - "8006:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      JSONRESPONSECLASS: ORJSONResponse
  app_one_base_middleware:
    image: fastapi-performance-optimization:latest
    ports:
    - "8001:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      PROCESSTIMEMIDDLEWARE: add
  app_one_starlette_middleware:
    image: fastapi-performance-optimization:latest
    ports:
    - "8003:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      STARLETTEPROCESSTIMEIDDLEWARE: add
  app_two_base_middlewares:
    image: fastapi-performance-optimization:latest
    ports:
    - "8002:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      CUSTOMHEADERMIDDLEWARE: add
      PROCESSTIMEMIDDLEWARE: add
  app_two_starlette_middlewares:
    image: fastapi-performance-optimization:latest
    ports:
    - "8004:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      STARLETTECUSTOMHEADERMIDDLEWARE: add
      STARLETTEPROCESSTIMEIDDLEWARE: add
  app_ujson_response_class:
    image: fastapi-performance-optimization:latest
    ports:
    - "8007:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      JSONRESPONSECLASS: UJSONResponse
  app_gunicorn_w1_t0:
    image: fastapi-performance-optimization:latest
    ports:
    - "8010:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      WORKERS: 1
      THREADS: 0
  app_gunicorn_w2_t0:
    image: fastapi-performance-optimization:latest
    ports:
    - "8011:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      WORKERS: 2
      THREADS: 0
  app_uvicorn_w1:
    image: fastapi-performance-optimization-uvicorn:latest
    container_name: fastapi-performance-optimization-uvicorn
    build:
      context: app_files
      dockerfile: Dockerfile_uvicorn
    ports:
    - "8015:8000"
    deploy:
      resources:
        limits:
          cpus: '2'

    restart: always
    "environment":
      "WORKERS": 1
  app_uvicorn_w2:
    image: fastapi-performance-optimization-uvicorn:latest
    deploy:
      resources:
        limits:
          cpus: '2'
    "environment":
      "WORKERS": 2
    "ports":
      - "8016:8000"
  app_uvicorn_multiprocess_w1:
    container_name: fastapi-performance-optimization-uvicorn-multiprocess
    build:
      context: app_files
      dockerfile: Dockerfile_uvicorn_processmanager
    image: fastapi-performance-optimization-uvicorn-multiprocess:latest
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
    "environment":
      "WORKERS": 1
    "ports":
      - "8019:8000"
  app_uvicorn_multiprocess_w2:
    image: fastapi-performance-optimization-uvicorn-multiprocess:latest
    ports:
    - "8020:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      WORKERS: 2
  app_fastapi_cli_w1:
    image: fastapi-performance-optimization-fastapi-cli:latest
    build:
      context: app_files
      dockerfile: Dockerfile_fastapi_cli
    ports:
    - "8021:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      WORKERS: 1
  app_fastapi_cli_w2:
    image: fastapi-performance-optimization-fastapi-cli:latest
    ports:
    - "8022:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      WORKERS: 2
  app_uvicorn_workers_w1:
    image: fastapi-performance-optimization-uvicorn-workers:latest
    build:
      context: app_files
      dockerfile: Dockerfile_uvicorn_workers
    ports:
    - "8023:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      WORKERS: 1
  app_uvicorn_workers_w2:
    image: fastapi-performance-optimization-uvicorn-workers:latest
    ports:
    - "8024:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      WORKERS: 2
  redis:
    image: redis
    ports:
    - 6379:6379
    deploy:
      resources:
        limits:
          cpus: '2'
  mock-api:
    image: fastapi-performance-optimization-mock-api:latest
    build:
      context: app_files
      dockerfile: Dockerfile_mock_api
    ports:
    - "8030:8030"
    deploy:
      resources:
        limits:
          cpus: '2'
  app_conn_pool:
    image: fastapi-performance-optimization:latest
    ports:
    - "8031:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
  app_conn_pool_pool_2:
    image: fastapi-performance-optimization:latest
    ports:
    - "8032:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      CONN_POOL_LIMIT: 2
      CONN_POOL_KEEPALIVE: 1
  app_conn_pool_pool_100:
    image: fastapi-performance-optimization:latest
    ports:
    - "8033:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      CONN_POOL_LIMIT: 100
      CONN_POOL_KEEPALIVE: 20
