services:


  app:
    image: fastapi-performance-optimization:latest
    container_name: fastapi-performance-optimization
    build:
      context: app_files
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: '2'
    restart: always
  app_default_json_response_class:
    image: fastapi-performance-optimization:latest
    ports:
    - 8005:8000
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      JSONRESPONSECLASS: JSONResponse

  app_nginx_port:
    image: fastapi-performance-optimization:latest
    ports:
    - "8008:8080"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      THREADS: 1
      WORKERS: 3
  app_nginx_socket:
    image: fastapi-performance-optimization:latest
    ports:
    - "8009:8081"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      SOCKET: 1
      THREADS: 1
      WORKERS: 3
  app_nginx_socket_keepalive:
    image: fastapi-performance-optimization:latest
    ports:
    - "8017:8082"
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      KEEPALIVE: 1
      SOCKET: 1
      THREADS: 1
      WORKERS: 3
  app_no_middleware:
